name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# zenblitz builds two executables: `zenblitz` (compiler + runtime) and
# `zenblitz-rt` (runtime only, the stub `--build` appends programs to).
# Everything platform-specific lives in cli/backend_stdio.cpp behind the
# zen::Backend interface, so these jobs are what proves libzen itself stays
# free of OS calls: a break in that rule shows up here as a build failure on
# a platform other than Linux.

jobs:
  linux:
    name: Linux (gcc, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Snapshot tests
        run: tests/run_tests.sh bin/zenblitz
      - name: Standalone executable (zenblitz-rt as stub)
        run: |
          set -e
          printf 'Print "standalone ok"\n' > /tmp/smoke.bb
          ./bin/zenblitz --build /tmp/smoke /tmp/smoke.bb
          out=$(/tmp/smoke)
          [ "$out" = "standalone ok" ] || { echo "::error::got '$out'"; exit 1; }
      - name: Runtime-only executable (.zbc)
        run: |
          set -e
          ./bin/zenblitz --dump /tmp/smoke.zbc /tmp/smoke.bb
          out=$(./bin/zenblitz-rt /tmp/smoke.zbc)
          [ "$out" = "standalone ok" ] || { echo "::error::got '$out'"; exit 1; }
      # Covers the whole userlib path: .decls parsing, dlopen, and the
      # thunk that turns Values into C arguments for each declared type.
      - name: Userlibs (.decls + shared library)
        run: |
          set -e
          mkdir -p bin/userlibs
          cat > /tmp/ul.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          int add_ints(long long a, long long b) { return (int)(a + b); }
          double scale(double x, double k) { return x * k; }
          const char *greet(const char *n) {
              static char b[256];
              snprintf(b, sizeof(b), "hello, %s!", n);
              return b;
          }
          int mixed(long long n, double f, const char *s) {
              return (int)(n + (long long)f + (long long)strlen(s));
          }
          EOF
          gcc -shared -fPIC -o bin/userlibs/libul.so /tmp/ul.c
          cat > bin/userlibs/ul.decls <<'EOF'
          .lib "libul.so"
          AddInts%(a%, b%) : "add_ints"
          Scale#(x#, k#) : "scale"
          Greet$(n$) : "greet"
          Mixed%(n%, f#, s$) : "mixed"
          EOF
          cat > /tmp/ul.bb <<'EOF'
          Print AddInts(3, 4)
          Print Scale(2.5, 4.0)
          Print Greet$("blitz")
          Print Mixed(10, 2.7, "abc")
          EOF
          got=$(./bin/zenblitz /tmp/ul.bb | tr '\n' '|')
          want='7|10.0|hello, blitz!|15|'
          [ "$got" = "$want" ] || { echo "::error::userlibs: got '$got' want '$want'"; exit 1; }
          # and the same through precompiled bytecode
          ./bin/zenblitz --dump /tmp/ul.zbc /tmp/ul.bb
          got=$(./bin/zenblitz-rt /tmp/ul.zbc | tr '\n' '|')
          [ "$got" = "$want" ] || { echo "::error::userlibs via .zbc: got '$got'"; exit 1; }
          # a program whose userlib is missing must say so, not crash
          ./bin/zenblitz --build /tmp/ulgame /tmp/ul.bb
          mkdir -p /tmp/noul && cp /tmp/ulgame /tmp/noul/
          if out=$(/tmp/noul/ulgame 2>&1); then
            echo "::error::expected a failure without the userlib, got: $out"; exit 1
          fi
          case "$out" in
            *"not available"*) ;;
            *) echo "::error::unclear message without the userlib: $out"; exit 1 ;;
          esac
          rm -rf bin/userlibs

  linux-clang:
    name: Linux (clang, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Snapshot tests
        run: tests/run_tests.sh bin/zenblitz

  linux-sanitize:
    name: Linux (gcc, ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Debug build type enables -fsanitize=address,undefined (see CMakeLists)
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Snapshot tests (sanitized)
        run: |
          export ASAN_OPTIONS=detect_leaks=0
          tests/run_tests.sh bin/zenblitz

  macos:
    name: macOS (clang, Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Snapshot tests
        run: tests/run_tests.sh bin/zenblitz

  windows-mingw:
    name: Windows (MinGW, Release)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      # Failures are re-emitted as ::error:: annotations so they are visible
      # through the public API (job logs need authentication).
      - name: Snapshot tests
        run: |
          set +e
          tests/run_tests.sh bin/zenblitz.exe | tee test_out.txt
          rc=${PIPESTATUS[0]}
          fails=$(grep '\[FAIL\]' test_out.txt | paste -sd'|' -)
          [ -n "$fails" ] && echo "::error::snapshot failures: $fails"
          exit $rc

  windows-msvc:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        shell: bash
        run: |
          set -e
          printf 'Print "msvc ok"\n' > smoke.bb
          echo "--- disassembly ---"
          ./bin/Release/zenblitz.exe --dis-only smoke.bb || true
          echo "--- run ---"
          out=$(./bin/Release/zenblitz.exe smoke.bb | tr -d '\r')
          [ "$out" = "msvc ok" ] || { echo "::error::got '$out'"; exit 1; }

  android:
    name: Android (NDK arm64, runtime only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the runtime cross-compiles for Android. Only zen_vm is built:
      # an Android app links that into its own .so with an SDL backend, so
      # there is no zenblitz-rt executable to produce here.
      - name: Configure (NDK toolchain)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_BUILD_CLI=OFF
      - name: Build the runtime
        run: cmake --build build-android -j"$(nproc)" --target zen_vm

  web:
    name: Web (Emscripten, runtime only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      # Same as Android: the browser host links zen_vm and drives resume()
      # from its own event loop (see cli/host_loop.h).
      - name: Configure
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release -DZEN_BUILD_CLI=OFF
      - name: Build the runtime
        run: cmake --build build-web -j"$(nproc)" --target zen_vm
