name: release

# Builds the compiler, runtime, 3D runtime and editor for each platform,
# packages them with the sample programs, and publishes them to a GitHub Release when a vX.Y.Z tag is
# pushed. workflow_dispatch does the same dry: it ends in a DRAFT prerelease
# you can inspect and delete, and creates no tag.
#
# Each archive is a complete, ready-to-use distribution: `zenblitz` (compiler
# + runtime), `zenblitz-rt` (runtime-only stub), `zenblitz3d` (the engine
# runtime), and `zenblitz-editor`.  The Windows ZIP also contains SDL2.dll,
# next to the executables that load it.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DZEN_BUILD_ENGINE=ON -DZEN_BUILD_EDITOR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Snapshot tests
        run: tests/run_tests.sh bin/zenblitz
      - name: Package
        run: tools/package.sh linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: zenblitz-linux-x86_64
          path: zenblitz-linux-x86_64.tar.gz

  macos:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DZEN_BUILD_ENGINE=ON -DZEN_BUILD_EDITOR=ON
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Snapshot tests
        run: tests/run_tests.sh bin/zenblitz
      - name: Package
        run: tools/package.sh macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: zenblitz-macos-arm64
          path: zenblitz-macos-arm64.tar.gz

  windows-mingw:
    name: windows-mingw-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZEN_BUILD_ENGINE=ON -DZEN_BUILD_EDITOR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Snapshot tests
        run: |
          set +e
          tests/run_tests.sh bin/zenblitz.exe | tee test_out.txt
          rc=${PIPESTATUS[0]}
          fails=$(grep '\[FAIL\]' test_out.txt | paste -sd'|' -)
          [ -n "$fails" ] && echo "::error::snapshot failures: $fails"
          exit $rc
      - name: Package
        run: tools/package.sh windows-x64 .exe
      - uses: actions/upload-artifact@v4
        with:
          name: zenblitz-windows-x64
          path: zenblitz-windows-x64.zip

  publish:
    name: publish release
    needs: [linux, macos, windows-mingw]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List staged assets
        run: ls -la dist
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "zenblitz $GITHUB_REF_NAME" --generate-notes
      - name: Draft prerelease (manual dry run)
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "dry-run-${{ github.run_number }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "Dry run #${{ github.run_number }} (delete me)" \
            --notes "workflow_dispatch dry run — no tag was created; delete after inspecting."
